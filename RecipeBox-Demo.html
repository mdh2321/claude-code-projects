<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeBox - AI-Powered Recipe Manager</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'claude-orange': '#D97757',
                        'claude-cream': '#F4F1EA',
                        'claude-dark': '#1C1C1C',
                        'claude-brown': '#8B7355',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
        }
    </style>
</head>
<body class="bg-claude-cream">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Mock Data
        const mockRecipes = [
            {
                id: '1',
                title: 'Classic Chocolate Chip Cookies',
                description: 'Soft, chewy cookies with gooey chocolate chips - a timeless favorite that everyone loves!',
                prepTime: 15,
                cookTime: 12,
                servings: 24,
                isFavorite: true,
                isWishList: false,
                categories: ['Dessert', 'Baking'],
                ingredients: [
                    { id: '1', text: '2 1/4 cups all-purpose flour' },
                    { id: '2', text: '1 tsp baking soda' },
                    { id: '3', text: '1 tsp salt' },
                    { id: '4', text: '1 cup butter, softened' },
                    { id: '5', text: '3/4 cup granulated sugar' },
                    { id: '6', text: '3/4 cup brown sugar' },
                    { id: '7', text: '2 large eggs' },
                    { id: '8', text: '2 tsp vanilla extract' },
                    { id: '9', text: '2 cups chocolate chips' },
                ],
                directions: [
                    { id: '1', stepNumber: 1, text: 'Preheat oven to 375°F (190°C).' },
                    { id: '2', stepNumber: 2, text: 'Mix flour, baking soda, and salt in a bowl.' },
                    { id: '3', stepNumber: 3, text: 'Beat butter and both sugars until creamy.' },
                    { id: '4', stepNumber: 4, text: 'Add eggs and vanilla, mix well.' },
                    { id: '5', stepNumber: 5, text: 'Gradually blend in flour mixture.' },
                    { id: '6', stepNumber: 6, text: 'Stir in chocolate chips.' },
                    { id: '7', stepNumber: 7, text: 'Drop rounded tablespoons onto ungreased cookie sheets.' },
                    { id: '8', stepNumber: 8, text: 'Bake 9-11 minutes or until golden brown. Cool on baking sheet for 2 minutes.' },
                ],
                tips: ['Use room temperature butter for best results', 'Don\'t overbake - cookies will firm up as they cool', 'For extra flavor, try using half dark chocolate chips'],
            },
            {
                id: '2',
                title: 'Creamy Tomato Pasta',
                description: 'Rich and creamy tomato sauce with perfectly cooked pasta - comfort food at its finest!',
                prepTime: 10,
                cookTime: 20,
                servings: 4,
                isFavorite: false,
                isWishList: true,
                categories: ['Dinner', 'Italian', 'Quick & Easy'],
                ingredients: [
                    { id: '1', text: '1 lb pasta (penne or rigatoni)' },
                    { id: '2', text: '2 cups crushed tomatoes' },
                    { id: '3', text: '1 cup heavy cream' },
                    { id: '4', text: '3 cloves garlic, minced' },
                    { id: '5', text: '1/4 cup parmesan cheese, grated' },
                    { id: '6', text: '2 tbsp olive oil' },
                    { id: '7', text: 'Fresh basil for garnish' },
                    { id: '8', text: 'Salt and pepper to taste' },
                ],
                directions: [
                    { id: '1', stepNumber: 1, text: 'Cook pasta according to package directions. Reserve 1 cup pasta water.' },
                    { id: '2', stepNumber: 2, text: 'Heat olive oil in a large pan, sauté garlic until fragrant (about 30 seconds).' },
                    { id: '3', stepNumber: 3, text: 'Add crushed tomatoes and simmer 10 minutes.' },
                    { id: '4', stepNumber: 4, text: 'Stir in heavy cream and parmesan cheese.' },
                    { id: '5', stepNumber: 5, text: 'Toss with cooked pasta, adding pasta water to reach desired consistency.' },
                    { id: '6', stepNumber: 6, text: 'Season with salt and pepper, garnish with fresh basil and serve immediately.' },
                ],
                tips: ['Save pasta water to adjust sauce consistency', 'Use full-fat cream for the best texture'],
            },
            {
                id: '3',
                title: 'Honey Garlic Chicken',
                description: 'Tender chicken with a sweet and savory glaze - perfect over rice or with vegetables!',
                prepTime: 15,
                cookTime: 25,
                servings: 6,
                isFavorite: true,
                isWishList: false,
                categories: ['Dinner', 'Chicken', 'Asian'],
                ingredients: [
                    { id: '1', text: '2 lbs chicken thighs, boneless' },
                    { id: '2', text: '1/3 cup honey' },
                    { id: '3', text: '1/4 cup soy sauce' },
                    { id: '4', text: '4 cloves garlic, minced' },
                    { id: '5', text: '1 tbsp ginger, grated' },
                    { id: '6', text: '2 tbsp olive oil' },
                    { id: '7', text: 'Sesame seeds for garnish' },
                    { id: '8', text: 'Green onions, sliced' },
                ],
                directions: [
                    { id: '1', stepNumber: 1, text: 'Season chicken thighs with salt and pepper.' },
                    { id: '2', stepNumber: 2, text: 'Mix honey, soy sauce, garlic, and ginger in a bowl.' },
                    { id: '3', stepNumber: 3, text: 'Heat oil in a large skillet over medium-high heat.' },
                    { id: '4', stepNumber: 4, text: 'Sear chicken until golden brown on both sides, about 3-4 minutes per side.' },
                    { id: '5', stepNumber: 5, text: 'Pour sauce over chicken and simmer until cooked through and sauce thickens, about 10-12 minutes.' },
                    { id: '6', stepNumber: 6, text: 'Garnish with sesame seeds and green onions. Serve over rice.' },
                ],
                tips: ['Use dark meat (thighs) for juicier results', 'Serve over rice or with steamed vegetables', 'Double the sauce if you want extra for drizzling'],
            },
            {
                id: '4',
                title: 'Fresh Garden Salad',
                description: 'Crisp vegetables with homemade vinaigrette - healthy and delicious!',
                prepTime: 15,
                cookTime: 0,
                servings: 4,
                isFavorite: false,
                isWishList: false,
                categories: ['Salad', 'Healthy', 'Quick & Easy'],
                ingredients: [
                    { id: '1', text: '6 cups mixed greens' },
                    { id: '2', text: '1 cucumber, sliced' },
                    { id: '3', text: '1 cup cherry tomatoes, halved' },
                    { id: '4', text: '1/2 red onion, thinly sliced' },
                    { id: '5', text: '1/4 cup olive oil' },
                    { id: '6', text: '2 tbsp balsamic vinegar' },
                    { id: '7', text: '1 tsp Dijon mustard' },
                    { id: '8', text: 'Salt and pepper to taste' },
                ],
                directions: [
                    { id: '1', stepNumber: 1, text: 'Wash and dry all vegetables thoroughly.' },
                    { id: '2', stepNumber: 2, text: 'Combine greens, cucumber, tomatoes, and onion in a large bowl.' },
                    { id: '3', stepNumber: 3, text: 'Whisk together olive oil, balsamic vinegar, Dijon mustard, salt, and pepper.' },
                    { id: '4', stepNumber: 4, text: 'Toss salad with dressing just before serving.' },
                ],
                tips: ['Add dressing right before serving to keep greens crisp', 'Try adding avocado or nuts for extra texture'],
            },
            {
                id: '5',
                title: 'Banana Bread',
                description: 'Moist and flavorful banana bread - perfect for breakfast or snacking!',
                prepTime: 15,
                cookTime: 60,
                servings: 12,
                isFavorite: true,
                isWishList: true,
                categories: ['Baking', 'Breakfast', 'Dessert'],
                ingredients: [
                    { id: '1', text: '3 ripe bananas, mashed' },
                    { id: '2', text: '1/3 cup melted butter' },
                    { id: '3', text: '3/4 cup sugar' },
                    { id: '4', text: '1 egg, beaten' },
                    { id: '5', text: '1 tsp vanilla extract' },
                    { id: '6', text: '1 tsp baking soda' },
                    { id: '7', text: '1 1/2 cups all-purpose flour' },
                    { id: '8', text: 'Pinch of salt' },
                ],
                directions: [
                    { id: '1', stepNumber: 1, text: 'Preheat oven to 350°F (175°C). Grease a 9x5 inch loaf pan.' },
                    { id: '2', stepNumber: 2, text: 'Mix mashed bananas with melted butter.' },
                    { id: '3', stepNumber: 3, text: 'Stir in sugar, egg, and vanilla.' },
                    { id: '4', stepNumber: 4, text: 'Sprinkle baking soda and salt over mixture and mix.' },
                    { id: '5', stepNumber: 5, text: 'Add flour and mix until just combined.' },
                    { id: '6', stepNumber: 6, text: 'Pour into prepared pan.' },
                    { id: '7', stepNumber: 7, text: 'Bake for 60-65 minutes until a toothpick comes out clean.' },
                    { id: '8', stepNumber: 8, text: 'Cool in pan for 10 minutes, then turn out onto a wire rack.' },
                ],
                tips: ['Use very ripe bananas for best flavor', 'Add chocolate chips or walnuts for variety', 'Bread freezes well - wrap tightly in plastic wrap'],
            },
        ];

        // Icons (simple SVG components)
        const ChefHatIcon = () => (
            <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
            </svg>
        );

        const HeartIcon = ({ filled, className }) => (
            <svg className={className} fill={filled ? "currentColor" : "none"} stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
            </svg>
        );

        const StarIcon = ({ filled, className }) => (
            <svg className={className} fill={filled ? "currentColor" : "none"} stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />
            </svg>
        );

        const ClockIcon = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const UsersIcon = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
        );

        const SearchIcon = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
        );

        const FilterIcon = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
            </svg>
        );

        const PlusIcon = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />
            </svg>
        );

        const ArrowLeftIcon = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
        );

        // Main App Component
        function App() {
            const [view, setView] = useState('list');
            const [filterType, setFilterType] = useState('all');
            const [selectedRecipe, setSelectedRecipe] = useState(null);
            const [recipes, setRecipes] = useState(mockRecipes);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('');

            const categories = ['Dessert', 'Baking', 'Dinner', 'Italian', 'Quick & Easy', 'Chicken', 'Asian', 'Salad', 'Healthy', 'Breakfast'];

            const toggleFavorite = (id) => {
                setRecipes(recipes.map(r => r.id === id ? { ...r, isFavorite: !r.isFavorite } : r));
                if (selectedRecipe?.id === id) {
                    setSelectedRecipe({ ...selectedRecipe, isFavorite: !selectedRecipe.isFavorite });
                }
            };

            const toggleWishlist = (id) => {
                setRecipes(recipes.map(r => r.id === id ? { ...r, isWishList: !r.isWishList } : r));
                if (selectedRecipe?.id === id) {
                    setSelectedRecipe({ ...selectedRecipe, isWishList: !selectedRecipe.isWishList });
                }
            };

            const filteredRecipes = recipes.filter(recipe => {
                const matchesSearch = recipe.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                    recipe.description?.toLowerCase().includes(searchTerm.toLowerCase());
                const matchesFilter = filterType === 'all' ? true :
                                    filterType === 'favorites' ? recipe.isFavorite :
                                    recipe.isWishList;
                const matchesCategory = !selectedCategory || recipe.categories.includes(selectedCategory);
                return matchesSearch && matchesFilter && matchesCategory;
            });

            const getTitle = () => {
                if (filterType === 'favorites') return 'Favorite Recipes';
                if (filterType === 'wishlist') return 'Wish List';
                return 'All Recipes';
            };

            return (
                <div className="min-h-screen bg-claude-cream">
                    {/* Header */}
                    <header className="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-16">
                                <button onClick={() => { setView('list'); setFilterType('all'); }} className="flex items-center space-x-2 hover:opacity-80 transition-opacity">
                                    <ChefHatIcon />
                                    <span className="text-2xl font-bold text-claude-dark">RecipeBox</span>
                                </button>

                                <nav className="hidden md:flex items-center space-x-1">
                                    <button
                                        onClick={() => { setView('list'); setFilterType('all'); }}
                                        className={`flex items-center space-x-2 px-4 py-2 rounded-lg transition-colors ${
                                            view === 'list' && filterType === 'all'
                                                ? 'bg-claude-orange text-white'
                                                : 'text-gray-700 hover:bg-gray-100'
                                        }`}
                                    >
                                        <ChefHatIcon />
                                        <span className="font-medium">All Recipes</span>
                                    </button>
                                    <button
                                        onClick={() => { setView('list'); setFilterType('favorites'); }}
                                        className={`flex items-center space-x-2 px-4 py-2 rounded-lg transition-colors ${
                                            view === 'list' && filterType === 'favorites'
                                                ? 'bg-claude-orange text-white'
                                                : 'text-gray-700 hover:bg-gray-100'
                                        }`}
                                    >
                                        <HeartIcon filled={false} className="w-5 h-5" />
                                        <span className="font-medium">Favorites</span>
                                    </button>
                                    <button
                                        onClick={() => { setView('list'); setFilterType('wishlist'); }}
                                        className={`flex items-center space-x-2 px-4 py-2 rounded-lg transition-colors ${
                                            view === 'list' && filterType === 'wishlist'
                                                ? 'bg-claude-orange text-white'
                                                : 'text-gray-700 hover:bg-gray-100'
                                        }`}
                                    >
                                        <StarIcon filled={false} className="w-5 h-5" />
                                        <span className="font-medium">Wish List</span>
                                    </button>
                                </nav>

                                <div className="bg-claude-orange text-white px-4 py-2 rounded-lg opacity-50 cursor-not-allowed flex items-center space-x-2">
                                    <PlusIcon className="w-5 h-5" />
                                    <span className="hidden sm:inline">Add Recipe</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {view === 'list' && (
                            <div className="space-y-6">
                                <div>
                                    <h1 className="text-4xl font-bold text-claude-dark mb-2">{getTitle()}</h1>
                                    <p className="text-gray-600">
                                        {filteredRecipes.length} {filteredRecipes.length === 1 ? 'recipe' : 'recipes'}
                                    </p>
                                </div>

                                <div className="flex flex-col sm:flex-row gap-4">
                                    <div className="flex-1 relative">
                                        <SearchIcon className="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" />
                                        <input
                                            type="text"
                                            placeholder="Search recipes..."
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value)}
                                            className="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-claude-orange focus:border-transparent"
                                        />
                                    </div>

                                    <div className="sm:w-64 relative">
                                        <FilterIcon className="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" />
                                        <select
                                            value={selectedCategory}
                                            onChange={(e) => setSelectedCategory(e.target.value)}
                                            className="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-claude-orange focus:border-transparent appearance-none cursor-pointer bg-white"
                                        >
                                            <option value="">All Categories</option>
                                            {categories.map((category) => (
                                                <option key={category} value={category}>
                                                    {category}
                                                </option>
                                            ))}
                                        </select>
                                    </div>
                                </div>

                                {filteredRecipes.length === 0 ? (
                                    <div className="text-center py-12">
                                        <div className="text-6xl mb-4">📖</div>
                                        <h3 className="text-xl font-semibold text-gray-700 mb-2">No recipes found</h3>
                                        <p className="text-gray-600">
                                            {searchTerm ? 'Try adjusting your search terms' : 'Start by adding your first recipe!'}
                                        </p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                        {filteredRecipes.map((recipe) => (
                                            <div key={recipe.id} className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 hover:shadow-md transition-shadow">
                                                <button onClick={() => { setSelectedRecipe(recipe); setView('detail'); }} className="w-full text-left">
                                                    <div className="w-full h-48 bg-gradient-to-br from-claude-orange to-claude-brown rounded-lg mb-4 flex items-center justify-center">
                                                        <span className="text-white text-6xl">🍳</span>
                                                    </div>

                                                    <div className="space-y-3">
                                                        <h3 className="text-xl font-bold text-claude-dark hover:text-claude-orange transition-colors line-clamp-2">
                                                            {recipe.title}
                                                        </h3>

                                                        {recipe.description && (
                                                            <p className="text-gray-600 text-sm line-clamp-2">
                                                                {recipe.description}
                                                            </p>
                                                        )}

                                                        <div className="flex items-center space-x-4 text-sm text-gray-500">
                                                            {(recipe.prepTime + recipe.cookTime) > 0 && (
                                                                <div className="flex items-center space-x-1">
                                                                    <ClockIcon className="w-4 h-4" />
                                                                    <span>{recipe.prepTime + recipe.cookTime} min</span>
                                                                </div>
                                                            )}
                                                            <div className="flex items-center space-x-1">
                                                                <UsersIcon className="w-4 h-4" />
                                                                <span>{recipe.servings}</span>
                                                            </div>
                                                        </div>

                                                        {recipe.categories.length > 0 && (
                                                            <div className="flex flex-wrap gap-2">
                                                                {recipe.categories.slice(0, 3).map((category) => (
                                                                    <span
                                                                        key={category}
                                                                        className="px-2 py-1 bg-gray-100 text-gray-700 text-xs rounded-full"
                                                                    >
                                                                        {category}
                                                                    </span>
                                                                ))}
                                                            </div>
                                                        )}
                                                    </div>
                                                </button>

                                                <div className="flex items-center justify-between mt-4 pt-4 border-t border-gray-200">
                                                    <button
                                                        onClick={() => toggleFavorite(recipe.id)}
                                                        className={`flex items-center space-x-1 px-3 py-1.5 rounded-lg transition-colors ${
                                                            recipe.isFavorite
                                                                ? 'bg-red-50 text-red-600'
                                                                : 'text-gray-600 hover:bg-gray-100'
                                                        }`}
                                                    >
                                                        <HeartIcon filled={recipe.isFavorite} className="w-5 h-5" />
                                                        <span className="text-sm">Favorite</span>
                                                    </button>

                                                    <button
                                                        onClick={() => toggleWishlist(recipe.id)}
                                                        className={`flex items-center space-x-1 px-3 py-1.5 rounded-lg transition-colors ${
                                                            recipe.isWishList
                                                                ? 'bg-yellow-50 text-yellow-600'
                                                                : 'text-gray-600 hover:bg-gray-100'
                                                        }`}
                                                    >
                                                        <StarIcon filled={recipe.isWishList} className="w-5 h-5" />
                                                        <span className="text-sm">Wish List</span>
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'detail' && selectedRecipe && (
                            <div className="max-w-4xl mx-auto space-y-6 pb-8">
                                <button
                                    onClick={() => setView('list')}
                                    className="inline-flex items-center space-x-2 text-gray-600 hover:text-claude-orange transition-colors"
                                >
                                    <ArrowLeftIcon className="w-5 h-5" />
                                    <span>Back to recipes</span>
                                </button>

                                <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                    <div className="w-full h-64 bg-gradient-to-br from-claude-orange to-claude-brown rounded-lg mb-6 flex items-center justify-center">
                                        <span className="text-white text-8xl">🍳</span>
                                    </div>

                                    <div className="space-y-4">
                                        <h1 className="text-4xl font-bold text-claude-dark">{selectedRecipe.title}</h1>

                                        {selectedRecipe.description && (
                                            <p className="text-lg text-gray-600">{selectedRecipe.description}</p>
                                        )}

                                        <div className="flex flex-wrap gap-4 text-gray-600">
                                            <div className="flex items-center space-x-2">
                                                <ClockIcon className="w-5 h-5" />
                                                <span>{selectedRecipe.prepTime + selectedRecipe.cookTime} min total</span>
                                                <span className="text-sm">({selectedRecipe.prepTime} prep)</span>
                                            </div>
                                            <div className="flex items-center space-x-2">
                                                <UsersIcon className="w-5 h-5" />
                                                <span>{selectedRecipe.servings} servings</span>
                                            </div>
                                        </div>

                                        {selectedRecipe.categories.length > 0 && (
                                            <div className="flex flex-wrap gap-2">
                                                {selectedRecipe.categories.map((category) => (
                                                    <span
                                                        key={category}
                                                        className="px-3 py-1 bg-gray-100 text-gray-700 rounded-full text-sm"
                                                    >
                                                        {category}
                                                    </span>
                                                ))}
                                            </div>
                                        )}

                                        <div className="flex flex-wrap gap-3 pt-4 border-t border-gray-200">
                                            <button
                                                onClick={() => toggleFavorite(selectedRecipe.id)}
                                                className={`flex items-center space-x-2 px-4 py-2 rounded-lg transition-colors ${
                                                    selectedRecipe.isFavorite
                                                        ? 'bg-red-50 text-red-600'
                                                        : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                                }`}
                                            >
                                                <HeartIcon filled={selectedRecipe.isFavorite} className="w-5 h-5" />
                                                <span>{selectedRecipe.isFavorite ? 'Favorited' : 'Add to Favorites'}</span>
                                            </button>

                                            <button
                                                onClick={() => toggleWishlist(selectedRecipe.id)}
                                                className={`flex items-center space-x-2 px-4 py-2 rounded-lg transition-colors ${
                                                    selectedRecipe.isWishList
                                                        ? 'bg-yellow-50 text-yellow-600'
                                                        : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                                }`}
                                            >
                                                <StarIcon filled={selectedRecipe.isWishList} className="w-5 h-5" />
                                                <span>{selectedRecipe.isWishList ? 'On Wish List' : 'Add to Wish List'}</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                    <h2 className="text-2xl font-bold text-claude-dark mb-4">Ingredients</h2>
                                    <ul className="space-y-2">
                                        {selectedRecipe.ingredients.map((ingredient) => (
                                            <li key={ingredient.id} className="flex items-start">
                                                <span className="inline-block w-2 h-2 bg-claude-orange rounded-full mt-2 mr-3 flex-shrink-0"></span>
                                                <span className="text-gray-700">{ingredient.text}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>

                                <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                    <h2 className="text-2xl font-bold text-claude-dark mb-4">Directions</h2>
                                    <ol className="space-y-4">
                                        {selectedRecipe.directions.map((direction) => (
                                            <li key={direction.id} className="flex">
                                                <span className="inline-flex items-center justify-center w-8 h-8 bg-claude-orange text-white rounded-full font-bold mr-4 flex-shrink-0">
                                                    {direction.stepNumber}
                                                </span>
                                                <p className="text-gray-700 pt-1">{direction.text}</p>
                                            </li>
                                        ))}
                                    </ol>
                                </div>

                                {selectedRecipe.tips && selectedRecipe.tips.length > 0 && (
                                    <div className="bg-yellow-50 border border-yellow-200 rounded-xl shadow-sm p-6">
                                        <h2 className="text-2xl font-bold text-claude-dark mb-4">💡 Tips</h2>
                                        <ul className="space-y-2">
                                            {selectedRecipe.tips.map((tip, index) => (
                                                <li key={index} className="flex items-start">
                                                    <span className="inline-block w-2 h-2 bg-yellow-600 rounded-full mt-2 mr-3 flex-shrink-0"></span>
                                                    <span className="text-gray-700">{tip}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Demo Notice Banner */}
                    <div className="fixed bottom-0 left-0 right-0 bg-claude-orange text-white py-3 px-4 text-center shadow-lg">
                        <p className="text-sm sm:text-base">
                            📱 <strong>Demo Mode:</strong> This is a preview of the RecipeBox UI. The full version includes AI recipe extraction, photo scanning, and database storage!
                        </p>
                    </div>
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
