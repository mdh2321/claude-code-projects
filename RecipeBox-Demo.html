                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
            </svg>
        );

        const NoteIcon = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
        );

        const PlayIcon = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
        );

        const SwapIcon = ({ className }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
            </svg>
        );

        // Main App Component
        function App() {
            const [view, setView] = useState('list');
            const [filterType, setFilterType] = useState('all');
            const [selectedRecipe, setSelectedRecipe] = useState(null);
            const [recipes, setRecipes] = useState(mockRecipes);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('');
            const [viewMode, setViewMode] = useState('gallery');
            const [cardSize, setCardSize] = useState('medium');
            const [sortBy, setSortBy] = useState('name');
            const [darkMode, setDarkMode] = useState(() => {
                const saved = localStorage.getItem('darkMode');
                return saved ? JSON.parse(saved) : false;
            });
            const [cookingMode, setCookingMode] = useState(false);
            const [currentStep, setCurrentStep] = useState(0);
            const [servingsMultiplier, setServingsMultiplier] = useState(1);
            const [showShareCard, setShowShareCard] = useState(false);
            const [recipeNotes, setRecipeNotes] = useState(() => {
                const saved = localStorage.getItem('recipeNotes');
                return saved ? JSON.parse(saved) : {};
            });
            const [showSubstitutions, setShowSubstitutions] = useState(null);

            const categories = ['Dessert', 'Baking', 'Dinner', 'Italian', 'Quick & Easy', 'Chicken', 'Asian', 'Salad', 'Healthy', 'Breakfast', 'Mexican'];

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                localStorage.setItem('darkMode', JSON.stringify(darkMode));
            }, [darkMode]);

            useEffect(() => {
                localStorage.setItem('recipeNotes', JSON.stringify(recipeNotes));
            }, [recipeNotes]);

            const toggleFavorite = (id) => {
                setRecipes(recipes.map(r => r.id === id ? { ...r, isFavorite: !r.isFavorite } : r));
                if (selectedRecipe?.id === id) {
                    setSelectedRecipe({ ...selectedRecipe, isFavorite: !selectedRecipe.isFavorite });
                }
            };

            const toggleWishlist = (id) => {
                setRecipes(recipes.map(r => r.id === id ? { ...r, isWishList: !r.isWishList } : r));
                if (selectedRecipe?.id === id) {
                    setSelectedRecipe({ ...selectedRecipe, isWishList: !selectedRecipe.isWishList });
                }
            };

            const addNote = (recipeId, note) => {
                setRecipeNotes(prev => ({
                    ...prev,
                    [recipeId]: [...(prev[recipeId] || []), note]
                }));
            };

            const deleteNote = (recipeId, noteIndex) => {
                setRecipeNotes(prev => ({
                    ...prev,
                    [recipeId]: prev[recipeId].filter((_, i) => i !== noteIndex)
                }));
            };

            const startCookingMode = (recipe) => {
                setSelectedRecipe(recipe);
                setCookingMode(true);
                setCurrentStep(0);
            };

            const shareRecipeCard = async (recipe) => {
                setSelectedRecipe(recipe);
                setShowShareCard(true);
            };

            const downloadCard = () => {
                const element = document.getElementById('share-card');
                html2canvas(element, {
                    backgroundColor: null,
                    scale: 2
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `${selectedRecipe.title.replace(/\s+/g, '-')}.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                    setShowShareCard(false);
                });
            };

            const sortedAndFilteredRecipes = useMemo(() => {
                let filtered = recipes.filter(recipe => {
                    const matchesSearch = recipe.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                        recipe.description?.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchesFilter = filterType === 'all' ? true :
                                        filterType === 'favorites' ? recipe.isFavorite :
                                        recipe.isWishList;
                    const matchesCategory = !selectedCategory || recipe.categories.includes(selectedCategory);
                    return matchesSearch && matchesFilter && matchesCategory;
                });

                const sorted = [...filtered].sort((a, b) => {
                    switch (sortBy) {
                        case 'name':
                            return a.title.localeCompare(b.title);
                        case 'time':
                            return (a.prepTime + a.cookTime) - (b.prepTime + b.cookTime);
                        case 'newest':
                            return new Date(b.createdAt) - new Date(a.createdAt);
                        case 'category':
                            return (a.categories[0] || '').localeCompare(b.categories[0] || '');
                        default:
                            return 0;
                    }
                });

                return sorted;
            }, [recipes, searchTerm, filterType, selectedCategory, sortBy]);

            const getTitle = () => {
                if (filterType === 'favorites') return 'Favorite Recipes';
                if (filterType === 'wishlist') return 'Wish List';
                return 'All Recipes';
            };

            const getGridClass = () => {
                if (viewMode === 'list' || viewMode === 'compact') return 'space-y-4';

                if (cardSize === 'small') {
                    return 'grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4';
                } else if (cardSize === 'large') {
                    return 'grid grid-cols-1 lg:grid-cols-2 gap-6';
                } else {
                    return 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6';
                }
            };

            // Cooking Mode Component
            if (cookingMode && selectedRecipe) {
                const currentDirection = selectedRecipe.directions[currentStep];
                const progress = ((currentStep + 1) / selectedRecipe.directions.length) * 100;

                return (
                    <div className="min-h-screen cooking-mode-bg text-white flex flex-col">
                        <div className="p-6 flex items-center justify-between border-b border-gray-700">
                            <button
                                onClick={() => setCookingMode(false)}
                                className="flex items-center gap-2 text-white hover:text-claude-orange transition-colors"
                            >
                                <ArrowLeftIcon className="w-6 h-6" />
                                <span>Exit Cooking Mode</span>
                            </button>
                            <div className="text-sm text-gray-400">
                                Step {currentStep + 1} of {selectedRecipe.directions.length}
                            </div>
                        </div>

                        <div className="w-full bg-gray-700 h-2">
                            <div
                                className="h-full bg-claude-orange transition-all duration-300"
                                style={{ width: `${progress}%` }}
                            />
                        </div>

                        <div className="flex-1 flex flex-col items-center justify-center p-8 max-w-4xl mx-auto w-full">
                            <div className="text-9xl mb-8 pulse-animation">
                                {recipeVisuals[selectedRecipe.title]?.emoji || '🍳'}
                            </div>

                            <h2 className="text-3xl md:text-5xl font-bold mb-12 text-center">
                                {selectedRecipe.title}
                            </h2>

                            <div className="bg-gray-800 rounded-2xl p-8 md:p-12 w-full mb-8">
                                <div className="flex items-start gap-6">
                                    <div className="flex-shrink-0 w-16 h-16 bg-claude-orange rounded-full flex items-center justify-center text-3xl font-bold">
                                        {currentDirection.stepNumber}
                                    </div>
                                    <p className="text-2xl md:text-4xl leading-relaxed">
                                        {currentDirection.text}
                                    </p>
                                </div>
                            </div>

                            <div className="flex gap-4">
                                <button
                                    onClick={() => setCurrentStep(Math.max(0, currentStep - 1))}
                                    disabled={currentStep === 0}
                                    className="px-8 py-4 bg-gray-700 rounded-xl text-xl disabled:opacity-30 disabled:cursor-not-allowed hover:bg-gray-600 transition-colors"
                                >
                                    ← Previous
                                </button>
                                <button
                                    onClick={() => setCurrentStep(Math.min(selectedRecipe.directions.length - 1, currentStep + 1))}
                                    disabled={currentStep === selectedRecipe.directions.length - 1}
                                    className="px-8 py-4 bg-claude-orange rounded-xl text-xl disabled:opacity-30 disabled:cursor-not-allowed hover:opacity-90 transition-opacity"
                                >
                                    Next →
                                </button>
                            </div>

                            {currentStep === selectedRecipe.directions.length - 1 && (
                                <div className="mt-8 text-center">
                                    <div className="text-6xl mb-4">🎉</div>
                                    <p className="text-2xl text-green-400">You're all done! Enjoy your meal!</p>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            // Share Card Modal
            if (showShareCard && selectedRecipe) {
                const visual = recipeVisuals[selectedRecipe.title];
                return (
                    <div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4">
                        <div className="bg-white rounded-xl max-w-2xl w-full p-6">
                            <div className="flex items-center justify-between mb-4">
                                <h3 className="text-2xl font-bold text-gray-900">Share Recipe Card</h3>
                                <button
                                    onClick={() => setShowShareCard(false)}
                                    className="text-gray-500 hover:text-gray-700 text-3xl"
                                >
                                    ×
                                </button>
                            </div>

                            <div id="share-card" className="relative rounded-2xl overflow-hidden" style={{ background: visual.gradient }}>
                                <div className="p-12 text-white">
                                    <div className="text-center mb-8">
                                        <div className="text-8xl mb-4">{visual.emoji}</div>
                                        <h1 className="text-5xl font-bold mb-4">{selectedRecipe.title}</h1>
                                        <p className="text-xl opacity-90">{selectedRecipe.description}</p>
                                    </div>

                                    <div className="flex justify-center gap-8 mb-8 text-lg">
                                        <div className="flex items-center gap-2">
                                            <ClockIcon className="w-6 h-6" />
                                            <span>{selectedRecipe.prepTime + selectedRecipe.cookTime} min</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <UsersIcon className="w-6 h-6" />
                                            <span>{selectedRecipe.servings} servings</span>
                                        </div>
                                    </div>

                                    <div className="bg-white bg-opacity-20 backdrop-blur rounded-xl p-6">
                                        <h3 className="text-2xl font-bold mb-4">Ingredients</h3>
                                        <div className="grid grid-cols-2 gap-2">
                                            {selectedRecipe.ingredients.slice(0, 8).map((ing, idx) => (
                                                <div key={idx} className="text-sm">• {ing.text}</div>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="mt-8 text-center text-sm opacity-75">
                                        Made with RecipeBox 🍳
                                    </div>
                                </div>
                            </div>

                            <div className="flex gap-4 mt-6">
                                <button
                                    onClick={downloadCard}
                                    className="flex-1 btn-primary"
                                >
                                    Download Image
                                </button>
                                <button
                                    onClick={() => setShowShareCard(false)}
                                    className="flex-1 btn-secondary"
                                >
                                    Cancel
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            const RecipeCard = ({ recipe }) => {
                const visual = recipeVisuals[recipe.title] || {
                    gradient: 'linear-gradient(135deg, #D97757 0%, #8B7355 100%)',
                    emoji: '🍳',
                    image: ''
                };
                const totalTime = recipe.prepTime + recipe.cookTime;

                if (viewMode === 'list') {
                    return (
                        <div className="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-4 hover:shadow-md transition-all fade-in flex items-center gap-4">
                            <button onClick={() => { setSelectedRecipe(recipe); setView('detail'); setServingsMultiplier(1); }} className="flex items-center gap-4 flex-1">
                                <div className="text-5xl flex-shrink-0">{visual.emoji}</div>
                                <div className="flex-1 text-left">
                                    <h3 className="text-lg font-bold text-claude-dark dark:text-white hover:text-claude-orange transition-colors">
                                        {recipe.title}
                                    </h3>
                                    <p className="text-sm text-gray-600 dark:text-gray-300 line-clamp-1">{recipe.description}</p>
                                    <div className="flex items-center gap-4 mt-2 text-xs text-gray-500 dark:text-gray-400">
                                        {totalTime > 0 && (
                                            <span className="flex items-center gap-1">
                                                <ClockIcon className="w-3 h-3" />
                                                {totalTime}min
                                            </span>
                                        )}
                                        <span className="flex items-center gap-1">
                                            <UsersIcon className="w-3 h-3" />
                                            {recipe.servings}
                                        </span>
                                        {recipe.categories.map(cat => (
                                            <span key={cat} className="px-2 py-0.5 bg-gray-100 dark:bg-gray-700 rounded-full">{cat}</span>
                                        ))}
                                    </div>
                                </div>
                            </button>
                            <div className="flex gap-2 flex-shrink-0">
                                <button
                                    onClick={() => toggleFavorite(recipe.id)}
                                    className={`p-2 rounded-lg transition-colors ${
                                        recipe.isFavorite ? 'bg-red-50 dark:bg-red-900 text-red-600 dark:text-red-400' : 'text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700'
                                    }`}
                                >
                                    <HeartIcon filled={recipe.isFavorite} className="w-5 h-5" />
                                </button>
                                <button
                                    onClick={() => toggleWishlist(recipe.id)}
                                    className={`p-2 rounded-lg transition-colors ${
                                        recipe.isWishList ? 'bg-yellow-50 dark:bg-yellow-900 text-yellow-600 dark:text-yellow-400' : 'text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700'
                                    }`}
                                >
                                    <StarIcon filled={recipe.isWishList} className="w-5 h-5" />
                                </button>
                            </div>
                        </div>
                    );
                }

                if (viewMode === 'compact') {
                    return (
                        <div className="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-3 hover:shadow-md transition-all fade-in flex items-center gap-3">
                            <button onClick={() => { setSelectedRecipe(recipe); setView('detail'); setServingsMultiplier(1); }} className="flex items-center gap-3 flex-1">
                                <div className="text-3xl">{visual.emoji}</div>
                                <div className="flex-1 text-left">
                                    <h3 className="font-semibold text-claude-dark dark:text-white hover:text-claude-orange transition-colors">
                                        {recipe.title}
                                    </h3>
                                    <div className="flex items-center gap-3 text-xs text-gray-500 dark:text-gray-400">
                                        {totalTime > 0 && <span>{totalTime}min</span>}
                                        <span>{recipe.servings} servings</span>
                                    </div>
                                </div>
                            </button>
                            <div className="flex gap-1">
                                <button
                                    onClick={() => toggleFavorite(recipe.id)}
                                    className={`p-1.5 rounded transition-colors ${
                                        recipe.isFavorite ? 'text-red-600 dark:text-red-400' : 'text-gray-300 hover:text-red-400'
                                    }`}
                                >
                                    <HeartIcon filled={recipe.isFavorite} className="w-4 h-4" />
                                </button>
                                <button
                                    onClick={() => toggleWishlist(recipe.id)}
                                    className={`p-1.5 rounded transition-colors ${
                                        recipe.isWishList ? 'text-yellow-600 dark:text-yellow-400' : 'text-gray-300 hover:text-yellow-400'
                                    }`}
                                >
                                    <StarIcon filled={recipe.isWishList} className="w-4 h-4" />
                                </button>
                            </div>
                        </div>
                    );
                }

                const cardHeightClass = cardSize === 'small' ? 'h-32' : cardSize === 'large' ? 'h-72' : 'h-48';

                return (
                    <div className="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-4 hover:shadow-lg transition-all fade-in">
                        <button onClick={() => { setSelectedRecipe(recipe); setView('detail'); setServingsMultiplier(1); }} className="w-full text-left">
                            <div
                                className={`w-full ${cardHeightClass} rounded-lg mb-3 flex items-center justify-center overflow-hidden recipe-image`}
                                style={{ backgroundImage: `url(${visual.image}), ${visual.gradient}` }}
                            >
                                <span className="text-white text-6xl drop-shadow-lg">{visual.emoji}</span>
                            </div>

                            <div className="space-y-2">
                                <h3 className={`font-bold text-claude-dark dark:text-white hover:text-claude-orange transition-colors ${cardSize === 'small' ? 'text-sm line-clamp-1' : 'text-lg line-clamp-2'}`}>
                                    {recipe.title}
                                </h3>

                                {cardSize !== 'small' && recipe.description && (
                                    <p className="text-gray-600 dark:text-gray-300 text-sm line-clamp-2">
                                        {recipe.description}
                                    </p>
                                )}

                                <div className="flex items-center gap-3 text-sm text-gray-500 dark:text-gray-400">
                                    {totalTime > 0 && (
                                        <div className="flex items-center gap-1">
                                            <ClockIcon className="w-4 h-4" />
                                            <span>{totalTime}min</span>
                                        </div>
                                    )}
                                    <div className="flex items-center gap-1">
                                        <UsersIcon className="w-4 h-4" />
                                        <span>{recipe.servings}</span>
                                    </div>
                                </div>

                                {cardSize !== 'small' && recipe.categories.length > 0 && (
                                    <div className="flex flex-wrap gap-1">
                                        {recipe.categories.slice(0, 2).map((category) => (
                                            <span key={category} className="px-2 py-1 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 text-xs rounded-full">
                                                {category}
                                            </span>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </button>

                        <div className="flex items-center justify-between mt-3 pt-3 border-t border-gray-200 dark:border-gray-700">
                            <button
                                onClick={() => toggleFavorite(recipe.id)}
                                className={`flex items-center gap-1 px-2 py-1.5 rounded-lg transition-colors ${
                                    recipe.isFavorite ? 'bg-red-50 dark:bg-red-900 text-red-600 dark:text-red-400' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700'
                                }`}
                            >
                                <HeartIcon filled={recipe.isFavorite} className="w-4 h-4" />
                                {cardSize !== 'small' && <span className="text-sm">Favorite</span>}
                            </button>

                            <button
                                onClick={() => toggleWishlist(recipe.id)}
                                className={`flex items-center gap-1 px-2 py-1.5 rounded-lg transition-colors ${
                                    recipe.isWishList ? 'bg-yellow-50 dark:bg-yellow-900 text-yellow-600 dark:text-yellow-400' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-700'
                                }`}
                            >
                                <StarIcon filled={recipe.isWishList} className="w-4 h-4" />
                                {cardSize !== 'small' && <span className="text-sm">Wish List</span>}
                            </button>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-claude-cream dark:bg-gray-900 transition-colors duration-300">
                    <header className="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 sticky top-0 z-50 shadow-sm transition-colors duration-300">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-16">
                                <button onClick={() => { setView('list'); setFilterType('all'); }} className="flex items-center gap-2 hover:opacity-80 transition-opacity">
                                    <ChefHatIcon className="text-claude-orange" />
                                    <span className="text-2xl font-bold text-claude-dark dark:text-white">RecipeBox</span>
                                </button>

                                <nav className="hidden md:flex items-center gap-1">
                                    <button
                                        onClick={() => { setView('list'); setFilterType('all'); }}
                                        className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-colors ${
                                            view === 'list' && filterType === 'all' ? 'bg-claude-orange text-white' : 'text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'
                                        }`}
                                    >
                                        <ChefHatIcon className="w-5 h-5" />
                                        <span className="font-medium">All Recipes</span>
                                    </button>
                                    <button
                                        onClick={() => { setView('list'); setFilterType('favorites'); }}
                                        className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-colors ${
                                            view === 'list' && filterType === 'favorites' ? 'bg-claude-orange text-white' : 'text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'
                                        }`}
                                    >
                                        <HeartIcon filled={false} className="w-5 h-5" />
                                        <span className="font-medium">Favorites</span>
                                    </button>
                                    <button
                                        onClick={() => { setView('list'); setFilterType('wishlist'); }}
                                        className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-colors ${
                                            view === 'list' && filterType === 'wishlist' ? 'bg-claude-orange text-white' : 'text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700'
                                        }`}
                                    >
                                        <StarIcon filled={false} className="w-5 h-5" />
                                        <span className="font-medium">Wish List</span>
                                    </button>
                                </nav>

                                <div className="flex items-center gap-2">
                                    <button
                                        onClick={() => setDarkMode(!darkMode)}
                                        className="p-2 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
                                        title={darkMode ? 'Light Mode' : 'Dark Mode'}
                                    >
                                        {darkMode ? <SunIcon className="w-6 h-6" /> : <MoonIcon className="w-6 h-6" />}
                                    </button>
                                    <div className="bg-claude-orange text-white px-4 py-2 rounded-lg opacity-50 cursor-not-allowed flex items-center gap-2">
                                        <PlusIcon className="w-5 h-5" />
                                        <span className="hidden sm:inline">Add Recipe</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {view === 'list' && (
                            <div className="space-y-6">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <h1 className="text-4xl font-bold text-claude-dark dark:text-white mb-2">{getTitle()}</h1>
                                        <p className="text-gray-600 dark:text-gray-400">
                                            {sortedAndFilteredRecipes.length} {sortedAndFilteredRecipes.length === 1 ? 'recipe' : 'recipes'}
                                        </p>
                                    </div>
                                </div>

                                <div className="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-4 transition-colors duration-300">
                                    <div className="flex flex-col lg:flex-row gap-4">
                                        <div className="flex-1 relative">
                                            <SearchIcon className="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" />
                                            <input
                                                type="text"
                                                placeholder="Search recipes..."
                                                value={searchTerm}
                                                onChange={(e) => setSearchTerm(e.target.value)}
                                                className="w-full px-4 py-2 pl-10 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-claude-orange focus:border-transparent"
                                            />
                                        </div>

                                        <div className="w-full lg:w-48 relative">
                                            <FilterIcon className="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" />
                                            <select
                                                value={selectedCategory}
                                                onChange={(e) => setSelectedCategory(e.target.value)}
                                                className="w-full px-4 py-2 pl-10 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-claude-orange focus:border-transparent appearance-none cursor-pointer"
                                            >
                                                <option value="">All Categories</option>
                                                {categories.map((category) => (
                                                    <option key={category} value={category}>{category}</option>
                                                ))}
                                            </select>
                                        </div>

                                        <div className="w-full lg:w-48 relative">
                                            <SortIcon className="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" />
                                            <select
                                                value={sortBy}
                                                onChange={(e) => setSortBy(e.target.value)}
                                                className="w-full px-4 py-2 pl-10 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-claude-orange focus:border-transparent appearance-none cursor-pointer"
                                            >
                                                <option value="name">Sort by Name</option>
                                                <option value="time">Sort by Time</option>
                                                <option value="newest">Sort by Newest</option>
                                                <option value="category">Sort by Category</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="flex items-center justify-between mt-4 pt-4 border-t border-gray-200 dark:border-gray-700">
                                        <div className="flex items-center gap-2">
                                            <span className="text-sm font-medium text-gray-700 dark:text-gray-300">View:</span>
                                            <div className="flex gap-1 bg-gray-100 dark:bg-gray-700 rounded-lg p-1">
                                                <button
                                                    onClick={() => setViewMode('gallery')}
                                                    className={`px-3 py-1.5 rounded-md transition-colors ${
                                                        viewMode === 'gallery' ? 'bg-white dark:bg-gray-600 shadow-sm text-claude-orange' : 'text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'
                                                    }`}
                                                    title="Gallery View"
                                                >
                                                    <GridIcon className="w-5 h-5" />
                                                </button>
                                                <button
                                                    onClick={() => setViewMode('list')}
                                                    className={`px-3 py-1.5 rounded-md transition-colors ${
                                                        viewMode === 'list' ? 'bg-white dark:bg-gray-600 shadow-sm text-claude-orange' : 'text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'
                                                    }`}
                                                    title="List View"
                                                >
                                                    <ListIcon className="w-5 h-5" />
                                                </button>
                                                <button
                                                    onClick={() => setViewMode('compact')}
                                                    className={`px-3 py-1.5 rounded-md transition-colors ${
                                                        viewMode === 'compact' ? 'bg-white dark:bg-gray-600 shadow-sm text-claude-orange' : 'text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'
                                                    }`}
                                                    title="Compact View"
                                                >
                                                    <LayoutIcon className="w-5 h-5" />
                                                </button>
                                            </div>
                                        </div>

                                        {viewMode === 'gallery' && (
                                            <div className="flex items-center gap-2">
                                                <span className="text-sm font-medium text-gray-700 dark:text-gray-300">Size:</span>
                                                <div className="flex gap-1 bg-gray-100 dark:bg-gray-700 rounded-lg p-1">
                                                    <button
                                                        onClick={() => setCardSize('small')}
                                                        className={`px-3 py-1.5 rounded-md text-sm transition-colors ${
                                                            cardSize === 'small' ? 'bg-white dark:bg-gray-600 shadow-sm text-claude-orange font-medium' : 'text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'
                                                        }`}
                                                    >
                                                        S
                                                    </button>
                                                    <button
                                                        onClick={() => setCardSize('medium')}
                                                        className={`px-3 py-1.5 rounded-md text-sm transition-colors ${
                                                            cardSize === 'medium' ? 'bg-white dark:bg-gray-600 shadow-sm text-claude-orange font-medium' : 'text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'
                                                        }`}
                                                    >
                                                        M
                                                    </button>
                                                    <button
                                                        onClick={() => setCardSize('large')}
                                                        className={`px-3 py-1.5 rounded-md text-sm transition-colors ${
                                                            cardSize === 'large' ? 'bg-white dark:bg-gray-600 shadow-sm text-claude-orange font-medium' : 'text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white'
                                                        }`}
                                                    >
                                                        L
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {sortedAndFilteredRecipes.length === 0 ? (
                                    <div className="text-center py-12">
                                        <div className="text-6xl mb-4">📖</div>
                                        <h3 className="text-xl font-semibold text-gray-700 dark:text-gray-300 mb-2">No recipes found</h3>
                                        <p className="text-gray-600 dark:text-gray-400">
                                            {searchTerm ? 'Try adjusting your search terms' : 'Start by adding your first recipe!'}
                                        </p>
                                    </div>
                                ) : (
                                    <div className={getGridClass()}>
                                        {sortedAndFilteredRecipes.map((recipe) => (
                                            <RecipeCard key={recipe.id} recipe={recipe} />
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'detail' && selectedRecipe && (
                            <div className="max-w-4xl mx-auto space-y-6 pb-8">
                                <button
                                    onClick={() => setView('list')}
                                    className="inline-flex items-center gap-2 text-gray-600 dark:text-gray-400 hover:text-claude-orange transition-colors"
                                >
                                    <ArrowLeftIcon className="w-5 h-5" />
                                    <span>Back to recipes</span>
                                </button>

                                <div className="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 transition-colors duration-300">
                                    <div
                                        className="w-full h-64 rounded-lg mb-6 flex items-center justify-center overflow-hidden recipe-image"
                                        style={{
                                            backgroundImage: `url(${recipeVisuals[selectedRecipe.title]?.image}), ${recipeVisuals[selectedRecipe.title]?.gradient || 'linear-gradient(135deg, #D97757 0%, #8B7355 100%)'}`
                                        }}
                                    >
                                        <span className="text-white text-8xl drop-shadow-lg">
                                            {recipeVisuals[selectedRecipe.title]?.emoji || '🍳'}
                                        </span>
                                    </div>

                                    <div className="space-y-4">
                                        <h1 className="text-4xl font-bold text-claude-dark dark:text-white">{selectedRecipe.title}</h1>

                                        {selectedRecipe.description && (
                                            <p className="text-lg text-gray-600 dark:text-gray-300">{selectedRecipe.description}</p>
                                        )}

                                        <div className="flex items-center gap-4 bg-gray-50 dark:bg-gray-700 rounded-lg p-4">
                                            <span className="text-sm font-medium text-gray-700 dark:text-gray-300">Servings:</span>
                                            <div className="flex items-center gap-2">
                                                <button
                                                    onClick={() => setServingsMultiplier(Math.max(0.5, servingsMultiplier - 0.5))}
                                                    className="p-1 bg-white dark:bg-gray-600 rounded-full hover:bg-gray-100 dark:hover:bg-gray-500 transition-colors"
                                                >
                                                    <MinusIcon className="w-5 h-5 text-gray-700 dark:text-gray-300" />
                                                </button>
                                                <span className="text-xl font-bold text-claude-orange min-w-[60px] text-center">
                                                    {Math.round(selectedRecipe.servings * servingsMultiplier)}
                                                </span>
                                                <button
                                                    onClick={() => setServingsMultiplier(servingsMultiplier + 0.5)}
                                                    className="p-1 bg-white dark:bg-gray-600 rounded-full hover:bg-gray-100 dark:hover:bg-gray-500 transition-colors"
                                                >
                                                    <PlusIcon className="w-5 h-5 text-gray-700 dark:text-gray-300" />
                                                </button>
                                            </div>
                                            {servingsMultiplier !== 1 && (
                                                <span className="text-sm text-gray-500 dark:text-gray-400">
                                                    ({servingsMultiplier}x original)
                                                </span>
                                            )}
                                        </div>

                                        <div className="flex flex-wrap gap-4 text-gray-600 dark:text-gray-300">
                                            <div className="flex items-center gap-2">
                                                <ClockIcon className="w-5 h-5" />
                                                <span>{selectedRecipe.prepTime + selectedRecipe.cookTime} min total</span>
                                                <span className="text-sm">({selectedRecipe.prepTime} prep)</span>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <UsersIcon className="w-5 h-5" />
                                                <span>{Math.round(selectedRecipe.servings * servingsMultiplier)} servings</span>
                                            </div>
                                        </div>

                                        {selectedRecipe.categories.length > 0 && (
                                            <div className="flex flex-wrap gap-2">
                                                {selectedRecipe.categories.map((category) => (
                                                    <span key={category} className="px-3 py-1 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-full text-sm">
                                                        {category}
                                                    </span>
                                                ))}
                                            </div>
                                        )}

                                        <div className="flex flex-wrap gap-3 pt-4 border-t border-gray-200 dark:border-gray-700">
                                            <button
                                                onClick={() => toggleFavorite(selectedRecipe.id)}
                                                className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-colors ${
                                                    selectedRecipe.isFavorite ? 'bg-red-50 dark:bg-red-900 text-red-600 dark:text-red-400' : 'bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600'
                                                }`}
                                            >
                                                <HeartIcon filled={selectedRecipe.isFavorite} className="w-5 h-5" />
                                                <span>{selectedRecipe.isFavorite ? 'Favorited' : 'Add to Favorites'}</span>
                                            </button>

                                            <button
                                                onClick={() => toggleWishlist(selectedRecipe.id)}
                                                className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-colors ${
                                                    selectedRecipe.isWishList ? 'bg-yellow-50 dark:bg-yellow-900 text-yellow-600 dark:text-yellow-400' : 'bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600'
                                                }`}
                                            >
                                                <StarIcon filled={selectedRecipe.isWishList} className="w-5 h-5" />
                                                <span>{selectedRecipe.isWishList ? 'On Wish List' : 'Add to Wish List'}</span>
                                            </button>

                                            <button
                                                onClick={() => startCookingMode(selectedRecipe)}
                                                className="flex items-center gap-2 px-4 py-2 rounded-lg bg-claude-orange text-white hover:opacity-90 transition-opacity"
                                            >
                                                <PlayIcon className="w-5 h-5" />
                                                <span>Cooking Mode</span>
                                            </button>

                                            <button
                                                onClick={() => shareRecipeCard(selectedRecipe)}
                                                className="flex items-center gap-2 px-4 py-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors"
                                            >
                                                <ShareIcon className="w-5 h-5" />
                                                <span>Share</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 transition-colors duration-300">
                                    <h2 className="text-2xl font-bold text-claude-dark dark:text-white mb-4">Ingredients</h2>
                                    <ul className="space-y-3">
                                        {selectedRecipe.ingredients.map((ingredient) => {
                                            const subs = findSubstitutions(ingredient.text);
                                            return (
                                                <li key={ingredient.id} className="flex items-start justify-between group">
                                                    <div className="flex items-start flex-1">
                                                        <span className="inline-block w-2 h-2 bg-claude-orange rounded-full mt-2 mr-3 flex-shrink-0"></span>
                                                        <span className="text-gray-700 dark:text-gray-300">
                                                            {scaleQuantity(ingredient.quantity, ingredient.unit, ingredient.text, servingsMultiplier)}
                                                        </span>
                                                    </div>
                                                    {subs && (
                                                        <button
                                                            onClick={() => setShowSubstitutions(showSubstitutions === ingredient.id ? null : ingredient.id)}
                                                            className="ml-2 p-1 text-gray-400 hover:text-claude-orange transition-colors opacity-0 group-hover:opacity-100"
                                                            title="Show substitutions"
                                                        >
                                                            <SwapIcon className="w-5 h-5" />
                                                        </button>
                                                    )}
                                                    {showSubstitutions === ingredient.id && subs && (
                                                        <div className="absolute right-6 bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 rounded-lg p-3 shadow-lg z-10 w-64">
                                                            <div className="text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2">
                                                                Substitute for {subs.ingredient}:
                                                            </div>
                                                            <ul className="space-y-1">
                                                                {subs.substitutions.map((sub, idx) => (
                                                                    <li key={idx} className="text-sm text-gray-600 dark:text-gray-400">
                                                                        • {sub}
                                                                    </li>
                                                                ))}
                                                            </ul>
                                                        </div>
                                                    )}
                                                </li>
                                            );
                                        })}
                                    </ul>
                                </div>

                                <div className="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 transition-colors duration-300">
                                    <h2 className="text-2xl font-bold text-claude-dark dark:text-white mb-4">Directions</h2>
                                    <ol className="space-y-4">
                                        {selectedRecipe.directions.map((direction) => (
                                            <li key={direction.id} className="flex">
                                                <span className="inline-flex items-center justify-center w-8 h-8 bg-claude-orange text-white rounded-full font-bold mr-4 flex-shrink-0">
                                                    {direction.stepNumber}
                                                </span>
                                                <p className="text-gray-700 dark:text-gray-300 pt-1">{direction.text}</p>
                                            </li>
                                        ))}
                                    </ol>
                                </div>

                                {selectedRecipe.tips && selectedRecipe.tips.length > 0 && (
                                    <div className="bg-yellow-50 dark:bg-yellow-900 dark:bg-opacity-20 border border-yellow-200 dark:border-yellow-700 rounded-xl shadow-sm p-6 transition-colors duration-300">
                                        <h2 className="text-2xl font-bold text-claude-dark dark:text-white mb-4">💡 Tips</h2>
                                        <ul className="space-y-2">
                                            {selectedRecipe.tips.map((tip, index) => (
                                                <li key={index} className="flex items-start">
                                                    <span className="inline-block w-2 h-2 bg-yellow-600 dark:bg-yellow-400 rounded-full mt-2 mr-3 flex-shrink-0"></span>
                                                    <span className="text-gray-700 dark:text-gray-300">{tip}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                )}

                                <div className="bg-white dark:bg-gray-800 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 transition-colors duration-300">
                                    <div className="flex items-center justify-between mb-4">
                                        <h2 className="text-2xl font-bold text-claude-dark dark:text-white">Personal Notes</h2>
                                        <NoteIcon className="w-6 h-6 text-gray-400" />
                                    </div>

                                    {recipeNotes[selectedRecipe.id] && recipeNotes[selectedRecipe.id].length > 0 && (
                                        <div className="space-y-2 mb-4">
                                            {recipeNotes[selectedRecipe.id].map((note, idx) => (
                                                <div key={idx} className="bg-gray-50 dark:bg-gray-700 rounded-lg p-3 flex items-start justify-between">
                                                    <p className="text-gray-700 dark:text-gray-300 flex-1">{note}</p>
                                                    <button
                                                        onClick={() => deleteNote(selectedRecipe.id, idx)}
                                                        className="ml-2 text-red-500 hover:text-red-700 text-sm"
                                                    >
                                                        ✕
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    <form onSubmit={(e) => {
                                        e.preventDefault();
                                        const input = e.target.elements.note;
                                        if (input.value.trim()) {
                                            addNote(selectedRecipe.id, input.value.trim());
                                            input.value = '';
                                        }
                                    }} className="flex gap-2">
                                        <input
                                            name="note"
                                            type="text"
                                            placeholder="Add a personal note (e.g., 'Doubled the garlic and it was perfect!')"
                                            className="flex-1 px-4 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-claude-orange"
                                        />
                                        <button type="submit" className="btn-primary">
                                            Add Note
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </main>

                    <div className="fixed bottom-0 left-0 right-0 bg-claude-orange dark:bg-gray-800 text-white py-3 px-4 text-center shadow-lg transition-colors duration-300">
                        <p className="text-sm sm:text-base">
                            ✨ <strong>New Features:</strong> Try Dark Mode, Cooking Mode, Recipe Scaling, Personal Notes & Ingredient Substitutions!
                        </p>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
