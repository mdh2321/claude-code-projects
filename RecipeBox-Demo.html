        // Main App Component
        function App() {
            const [view, setView] = useState('list');
            const [filterType, setFilterType] = useState('all');
            const [selectedRecipe, setSelectedRecipe] = useState(null);
            const [recipes, setRecipes] = useState(mockRecipes);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('');
            const [viewMode, setViewMode] = useState('gallery'); // gallery, list, compact
            const [cardSize, setCardSize] = useState('medium'); // small, medium, large
            const [sortBy, setSortBy] = useState('name'); // name, time, newest, category

            const categories = ['Dessert', 'Baking', 'Dinner', 'Italian', 'Quick & Easy', 'Chicken', 'Asian', 'Salad', 'Healthy', 'Breakfast', 'Mexican'];

            const toggleFavorite = (id) => {
                setRecipes(recipes.map(r => r.id === id ? { ...r, isFavorite: !r.isFavorite } : r));
                if (selectedRecipe?.id === id) {
                    setSelectedRecipe({ ...selectedRecipe, isFavorite: !selectedRecipe.isFavorite });
                }
            };

            const toggleWishlist = (id) => {
                setRecipes(recipes.map(r => r.id === id ? { ...r, isWishList: !r.isWishList } : r));
                if (selectedRecipe?.id === id) {
                    setSelectedRecipe({ ...selectedRecipe, isWishList: !selectedRecipe.isWishList });
                }
            };

            const sortedAndFilteredRecipes = useMemo(() => {
                let filtered = recipes.filter(recipe => {
                    const matchesSearch = recipe.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                        recipe.description?.toLowerCase().includes(searchTerm.toLowerCase());
                    const matchesFilter = filterType === 'all' ? true :
                                        filterType === 'favorites' ? recipe.isFavorite :
                                        recipe.isWishList;
                    const matchesCategory = !selectedCategory || recipe.categories.includes(selectedCategory);
                    return matchesSearch && matchesFilter && matchesCategory;
                });

                // Sort
                const sorted = [...filtered].sort((a, b) => {
                    switch (sortBy) {
                        case 'name':
                            return a.title.localeCompare(b.title);
                        case 'time':
                            return (a.prepTime + a.cookTime) - (b.prepTime + b.cookTime);
                        case 'newest':
                            return new Date(b.createdAt) - new Date(a.createdAt);
                        case 'category':
                            return (a.categories[0] || '').localeCompare(b.categories[0] || '');
                        default:
                            return 0;
                    }
                });

                return sorted;
            }, [recipes, searchTerm, filterType, selectedCategory, sortBy]);

            const getTitle = () => {
                if (filterType === 'favorites') return 'Favorite Recipes';
                if (filterType === 'wishlist') return 'Wish List';
                return 'All Recipes';
            };

            const getGridClass = () => {
                if (viewMode === 'list' || viewMode === 'compact') return 'space-y-4';

                if (cardSize === 'small') {
                    return 'grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4';
                } else if (cardSize === 'large') {
                    return 'grid grid-cols-1 lg:grid-cols-2 gap-6';
                } else {
                    return 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6';
                }
            };

            const RecipeCard = ({ recipe }) => {
                const visual = recipeVisuals[recipe.title] || {
                    gradient: 'linear-gradient(135deg, #D97757 0%, #8B7355 100%)',
                    emoji: '🍳',
                    image: ''
                };
                const totalTime = recipe.prepTime + recipe.cookTime;

                // List View
                if (viewMode === 'list') {
                    return (
                        <div className="bg-white rounded-lg shadow-sm border border-gray-200 p-4 hover:shadow-md transition-all fade-in flex items-center gap-4">
                            <button onClick={() => { setSelectedRecipe(recipe); setView('detail'); }} className="flex items-center gap-4 flex-1">
                                <div className="text-5xl flex-shrink-0">{visual.emoji}</div>
                                <div className="flex-1 text-left">
                                    <h3 className="text-lg font-bold text-claude-dark hover:text-claude-orange transition-colors">
                                        {recipe.title}
                                    </h3>
                                    <p className="text-sm text-gray-600 line-clamp-1">{recipe.description}</p>
                                    <div className="flex items-center gap-4 mt-2 text-xs text-gray-500">
                                        {totalTime > 0 && (
                                            <span className="flex items-center gap-1">
                                                <ClockIcon className="w-3 h-3" />
                                                {totalTime}min
                                            </span>
                                        )}
                                        <span className="flex items-center gap-1">
                                            <UsersIcon className="w-3 h-3" />
                                            {recipe.servings}
                                        </span>
                                        {recipe.categories.map(cat => (
                                            <span key={cat} className="px-2 py-0.5 bg-gray-100 rounded-full">{cat}</span>
                                        ))}
                                    </div>
                                </div>
                            </button>
                            <div className="flex gap-2 flex-shrink-0">
                                <button
                                    onClick={() => toggleFavorite(recipe.id)}
                                    className={`p-2 rounded-lg transition-colors ${
                                        recipe.isFavorite ? 'bg-red-50 text-red-600' : 'text-gray-400 hover:bg-gray-100'
                                    }`}
                                >
                                    <HeartIcon filled={recipe.isFavorite} className="w-5 h-5" />
                                </button>
                                <button
                                    onClick={() => toggleWishlist(recipe.id)}
                                    className={`p-2 rounded-lg transition-colors ${
                                        recipe.isWishList ? 'bg-yellow-50 text-yellow-600' : 'text-gray-400 hover:bg-gray-100'
                                    }`}
                                >
                                    <StarIcon filled={recipe.isWishList} className="w-5 h-5" />
                                </button>
                            </div>
                        </div>
                    );
                }

                // Compact List View
                if (viewMode === 'compact') {
                    return (
                        <div className="bg-white rounded-lg shadow-sm border border-gray-200 p-3 hover:shadow-md transition-all fade-in flex items-center gap-3">
                            <button onClick={() => { setSelectedRecipe(recipe); setView('detail'); }} className="flex items-center gap-3 flex-1">
                                <div className="text-3xl">{visual.emoji}</div>
                                <div className="flex-1 text-left">
                                    <h3 className="font-semibold text-claude-dark hover:text-claude-orange transition-colors">
                                        {recipe.title}
                                    </h3>
                                    <div className="flex items-center gap-3 text-xs text-gray-500">
                                        {totalTime > 0 && <span>{totalTime}min</span>}
                                        <span>{recipe.servings} servings</span>
                                    </div>
                                </div>
                            </button>
                            <div className="flex gap-1">
                                <button
                                    onClick={() => toggleFavorite(recipe.id)}
                                    className={`p-1.5 rounded transition-colors ${
                                        recipe.isFavorite ? 'text-red-600' : 'text-gray-300 hover:text-red-400'
                                    }`}
                                >
                                    <HeartIcon filled={recipe.isFavorite} className="w-4 h-4" />
                                </button>
                                <button
                                    onClick={() => toggleWishlist(recipe.id)}
                                    className={`p-1.5 rounded transition-colors ${
                                        recipe.isWishList ? 'text-yellow-600' : 'text-gray-300 hover:text-yellow-400'
                                    }`}
                                >
                                    <StarIcon filled={recipe.isWishList} className="w-4 h-4" />
                                </button>
                            </div>
                        </div>
                    );
                }

                // Gallery View (Card)
                const cardHeightClass = cardSize === 'small' ? 'h-32' : cardSize === 'large' ? 'h-72' : 'h-48';

                return (
                    <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-4 hover:shadow-lg transition-all fade-in">
                        <button onClick={() => { setSelectedRecipe(recipe); setView('detail'); }} className="w-full text-left">
                            <div
                                className={`w-full ${cardHeightClass} rounded-lg mb-3 flex items-center justify-center overflow-hidden recipe-image`}
                                style={{ backgroundImage: `url(${visual.image}), ${visual.gradient}` }}
                            >
                                <span className="text-white text-6xl drop-shadow-lg">{visual.emoji}</span>
                            </div>

                            <div className="space-y-2">
                                <h3 className={`font-bold text-claude-dark hover:text-claude-orange transition-colors ${cardSize === 'small' ? 'text-sm line-clamp-1' : 'text-lg line-clamp-2'}`}>
                                    {recipe.title}
                                </h3>

                                {cardSize !== 'small' && recipe.description && (
                                    <p className="text-gray-600 text-sm line-clamp-2">
                                        {recipe.description}
                                    </p>
                                )}

                                <div className="flex items-center gap-3 text-sm text-gray-500">
                                    {totalTime > 0 && (
                                        <div className="flex items-center gap-1">
                                            <ClockIcon className="w-4 h-4" />
                                            <span>{totalTime}min</span>
                                        </div>
                                    )}
                                    <div className="flex items-center gap-1">
                                        <UsersIcon className="w-4 h-4" />
                                        <span>{recipe.servings}</span>
                                    </div>
                                </div>

                                {cardSize !== 'small' && recipe.categories.length > 0 && (
                                    <div className="flex flex-wrap gap-1">
                                        {recipe.categories.slice(0, 2).map((category) => (
                                            <span key={category} className="px-2 py-1 bg-gray-100 text-gray-700 text-xs rounded-full">
                                                {category}
                                            </span>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </button>

                        <div className="flex items-center justify-between mt-3 pt-3 border-t border-gray-200">
                            <button
                                onClick={() => toggleFavorite(recipe.id)}
                                className={`flex items-center gap-1 px-2 py-1.5 rounded-lg transition-colors ${
                                    recipe.isFavorite ? 'bg-red-50 text-red-600' : 'text-gray-600 hover:bg-gray-100'
                                }`}
                            >
                                <HeartIcon filled={recipe.isFavorite} className="w-4 h-4" />
                                {cardSize !== 'small' && <span className="text-sm">Favorite</span>}
                            </button>

                            <button
                                onClick={() => toggleWishlist(recipe.id)}
                                className={`flex items-center gap-1 px-2 py-1.5 rounded-lg transition-colors ${
                                    recipe.isWishList ? 'bg-yellow-50 text-yellow-600' : 'text-gray-600 hover:bg-gray-100'
                                }`}
                            >
                                <StarIcon filled={recipe.isWishList} className="w-4 h-4" />
                                {cardSize !== 'small' && <span className="text-sm">Wish List</span>}
                            </button>
                        </div>
                    </div>
                );
            };

            return (
                <div className="min-h-screen bg-claude-cream">
                    {/* Header */}
                    <header className="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-16">
                                <button onClick={() => { setView('list'); setFilterType('all'); }} className="flex items-center gap-2 hover:opacity-80 transition-opacity">
                                    <ChefHatIcon />
                                    <span className="text-2xl font-bold text-claude-dark">RecipeBox</span>
                                </button>

                                <nav className="hidden md:flex items-center gap-1">
                                    <button
                                        onClick={() => { setView('list'); setFilterType('all'); }}
                                        className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-colors ${
                                            view === 'list' && filterType === 'all' ? 'bg-claude-orange text-white' : 'text-gray-700 hover:bg-gray-100'
                                        }`}
                                    >
                                        <ChefHatIcon className="w-5 h-5" />
                                        <span className="font-medium">All Recipes</span>
                                    </button>
                                    <button
                                        onClick={() => { setView('list'); setFilterType('favorites'); }}
                                        className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-colors ${
                                            view === 'list' && filterType === 'favorites' ? 'bg-claude-orange text-white' : 'text-gray-700 hover:bg-gray-100'
                                        }`}
                                    >
                                        <HeartIcon filled={false} className="w-5 h-5" />
                                        <span className="font-medium">Favorites</span>
                                    </button>
                                    <button
                                        onClick={() => { setView('list'); setFilterType('wishlist'); }}
                                        className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-colors ${
                                            view === 'list' && filterType === 'wishlist' ? 'bg-claude-orange text-white' : 'text-gray-700 hover:bg-gray-100'
                                        }`}
                                    >
                                        <StarIcon filled={false} className="w-5 h-5" />
                                        <span className="font-medium">Wish List</span>
                                    </button>
                                </nav>

                                <div className="bg-claude-orange text-white px-4 py-2 rounded-lg opacity-50 cursor-not-allowed flex items-center gap-2">
                                    <PlusIcon className="w-5 h-5" />
                                    <span className="hidden sm:inline">Add Recipe</span>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {view === 'list' && (
                            <div className="space-y-6">
                                <div className="flex items-center justify-between">
                                    <div>
                                        <h1 className="text-4xl font-bold text-claude-dark mb-2">{getTitle()}</h1>
                                        <p className="text-gray-600">
                                            {sortedAndFilteredRecipes.length} {sortedAndFilteredRecipes.length === 1 ? 'recipe' : 'recipes'}
                                        </p>
                                    </div>
                                </div>

                                {/* Controls Bar */}
                                <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-4">
                                    <div className="flex flex-col lg:flex-row gap-4">
                                        {/* Search */}
                                        <div className="flex-1 relative">
                                            <SearchIcon className="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" />
                                            <input
                                                type="text"
                                                placeholder="Search recipes..."
                                                value={searchTerm}
                                                onChange={(e) => setSearchTerm(e.target.value)}
                                                className="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-claude-orange focus:border-transparent"
                                            />
                                        </div>

                                        {/* Filter by Category */}
                                        <div className="w-full lg:w-48 relative">
                                            <FilterIcon className="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" />
                                            <select
                                                value={selectedCategory}
                                                onChange={(e) => setSelectedCategory(e.target.value)}
                                                className="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-claude-orange focus:border-transparent appearance-none cursor-pointer bg-white"
                                            >
                                                <option value="">All Categories</option>
                                                {categories.map((category) => (
                                                    <option key={category} value={category}>{category}</option>
                                                ))}
                                            </select>
                                        </div>

                                        {/* Sort */}
                                        <div className="w-full lg:w-48 relative">
                                            <SortIcon className="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400" />
                                            <select
                                                value={sortBy}
                                                onChange={(e) => setSortBy(e.target.value)}
                                                className="w-full px-4 py-2 pl-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-claude-orange focus:border-transparent appearance-none cursor-pointer bg-white"
                                            >
                                                <option value="name">Sort by Name</option>
                                                <option value="time">Sort by Time</option>
                                                <option value="newest">Sort by Newest</option>
                                                <option value="category">Sort by Category</option>
                                            </select>
                                        </div>
                                    </div>

                                    {/* View Controls */}
                                    <div className="flex items-center justify-between mt-4 pt-4 border-t border-gray-200">
                                        <div className="flex items-center gap-2">
                                            <span className="text-sm font-medium text-gray-700">View:</span>
                                            <div className="flex gap-1 bg-gray-100 rounded-lg p-1">
                                                <button
                                                    onClick={() => setViewMode('gallery')}
                                                    className={`px-3 py-1.5 rounded-md transition-colors ${
                                                        viewMode === 'gallery' ? 'bg-white shadow-sm text-claude-orange' : 'text-gray-600 hover:text-gray-900'
                                                    }`}
                                                    title="Gallery View"
                                                >
                                                    <GridIcon className="w-5 h-5" />
                                                </button>
                                                <button
                                                    onClick={() => setViewMode('list')}
                                                    className={`px-3 py-1.5 rounded-md transition-colors ${
                                                        viewMode === 'list' ? 'bg-white shadow-sm text-claude-orange' : 'text-gray-600 hover:text-gray-900'
                                                    }`}
                                                    title="List View"
                                                >
                                                    <ListIcon className="w-5 h-5" />
                                                </button>
                                                <button
                                                    onClick={() => setViewMode('compact')}
                                                    className={`px-3 py-1.5 rounded-md transition-colors ${
                                                        viewMode === 'compact' ? 'bg-white shadow-sm text-claude-orange' : 'text-gray-600 hover:text-gray-900'
                                                    }`}
                                                    title="Compact View"
                                                >
                                                    <LayoutIcon className="w-5 h-5" />
                                                </button>
                                            </div>
                                        </div>

                                        {viewMode === 'gallery' && (
                                            <div className="flex items-center gap-2">
                                                <span className="text-sm font-medium text-gray-700">Size:</span>
                                                <div className="flex gap-1 bg-gray-100 rounded-lg p-1">
                                                    <button
                                                        onClick={() => setCardSize('small')}
                                                        className={`px-3 py-1.5 rounded-md text-sm transition-colors ${
                                                            cardSize === 'small' ? 'bg-white shadow-sm text-claude-orange font-medium' : 'text-gray-600 hover:text-gray-900'
                                                        }`}
                                                    >
                                                        S
                                                    </button>
                                                    <button
                                                        onClick={() => setCardSize('medium')}
                                                        className={`px-3 py-1.5 rounded-md text-sm transition-colors ${
                                                            cardSize === 'medium' ? 'bg-white shadow-sm text-claude-orange font-medium' : 'text-gray-600 hover:text-gray-900'
                                                        }`}
                                                    >
                                                        M
                                                    </button>
                                                    <button
                                                        onClick={() => setCardSize('large')}
                                                        className={`px-3 py-1.5 rounded-md text-sm transition-colors ${
                                                            cardSize === 'large' ? 'bg-white shadow-sm text-claude-orange font-medium' : 'text-gray-600 hover:text-gray-900'
                                                        }`}
                                                    >
                                                        L
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* Recipe Grid/List */}
                                {sortedAndFilteredRecipes.length === 0 ? (
                                    <div className="text-center py-12">
                                        <div className="text-6xl mb-4">📖</div>
                                        <h3 className="text-xl font-semibold text-gray-700 mb-2">No recipes found</h3>
                                        <p className="text-gray-600">
                                            {searchTerm ? 'Try adjusting your search terms' : 'Start by adding your first recipe!'}
                                        </p>
                                    </div>
                                ) : (
                                    <div className={getGridClass()}>
                                        {sortedAndFilteredRecipes.map((recipe) => (
                                            <RecipeCard key={recipe.id} recipe={recipe} />
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'detail' && selectedRecipe && (
                            <div className="max-w-4xl mx-auto space-y-6 pb-8">
                                <button
                                    onClick={() => setView('list')}
                                    className="inline-flex items-center gap-2 text-gray-600 hover:text-claude-orange transition-colors"
                                >
                                    <ArrowLeftIcon className="w-5 h-5" />
                                    <span>Back to recipes</span>
                                </button>

                                <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                    <div
                                        className="w-full h-64 rounded-lg mb-6 flex items-center justify-center overflow-hidden recipe-image"
                                        style={{
                                            backgroundImage: `url(${recipeVisuals[selectedRecipe.title]?.image}), ${recipeVisuals[selectedRecipe.title]?.gradient || 'linear-gradient(135deg, #D97757 0%, #8B7355 100%)'}`
                                        }}
                                    >
                                        <span className="text-white text-8xl drop-shadow-lg">
                                            {recipeVisuals[selectedRecipe.title]?.emoji || '🍳'}
                                        </span>
                                    </div>

                                    <div className="space-y-4">
                                        <h1 className="text-4xl font-bold text-claude-dark">{selectedRecipe.title}</h1>

                                        {selectedRecipe.description && (
                                            <p className="text-lg text-gray-600">{selectedRecipe.description}</p>
                                        )}

                                        <div className="flex flex-wrap gap-4 text-gray-600">
                                            <div className="flex items-center gap-2">
                                                <ClockIcon className="w-5 h-5" />
                                                <span>{selectedRecipe.prepTime + selectedRecipe.cookTime} min total</span>
                                                <span className="text-sm">({selectedRecipe.prepTime} prep)</span>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <UsersIcon className="w-5 h-5" />
                                                <span>{selectedRecipe.servings} servings</span>
                                            </div>
                                        </div>

                                        {selectedRecipe.categories.length > 0 && (
                                            <div className="flex flex-wrap gap-2">
                                                {selectedRecipe.categories.map((category) => (
                                                    <span key={category} className="px-3 py-1 bg-gray-100 text-gray-700 rounded-full text-sm">
                                                        {category}
                                                    </span>
                                                ))}
                                            </div>
                                        )}

                                        <div className="flex flex-wrap gap-3 pt-4 border-t border-gray-200">
                                            <button
                                                onClick={() => toggleFavorite(selectedRecipe.id)}
                                                className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-colors ${
                                                    selectedRecipe.isFavorite ? 'bg-red-50 text-red-600' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                                }`}
                                            >
                                                <HeartIcon filled={selectedRecipe.isFavorite} className="w-5 h-5" />
                                                <span>{selectedRecipe.isFavorite ? 'Favorited' : 'Add to Favorites'}</span>
                                            </button>

                                            <button
                                                onClick={() => toggleWishlist(selectedRecipe.id)}
                                                className={`flex items-center gap-2 px-4 py-2 rounded-lg transition-colors ${
                                                    selectedRecipe.isWishList ? 'bg-yellow-50 text-yellow-600' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'
                                                }`}
                                            >
                                                <StarIcon filled={selectedRecipe.isWishList} className="w-5 h-5" />
                                                <span>{selectedRecipe.isWishList ? 'On Wish List' : 'Add to Wish List'}</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                    <h2 className="text-2xl font-bold text-claude-dark mb-4">Ingredients</h2>
                                    <ul className="space-y-2">
                                        {selectedRecipe.ingredients.map((ingredient) => (
                                            <li key={ingredient.id} className="flex items-start">
                                                <span className="inline-block w-2 h-2 bg-claude-orange rounded-full mt-2 mr-3 flex-shrink-0"></span>
                                                <span className="text-gray-700">{ingredient.text}</span>
                                            </li>
                                        ))}
                                    </ul>
                                </div>

                                <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                                    <h2 className="text-2xl font-bold text-claude-dark mb-4">Directions</h2>
                                    <ol className="space-y-4">
                                        {selectedRecipe.directions.map((direction) => (
                                            <li key={direction.id} className="flex">
                                                <span className="inline-flex items-center justify-center w-8 h-8 bg-claude-orange text-white rounded-full font-bold mr-4 flex-shrink-0">
                                                    {direction.stepNumber}
                                                </span>
                                                <p className="text-gray-700 pt-1">{direction.text}</p>
                                            </li>
                                        ))}
                                    </ol>
                                </div>

                                {selectedRecipe.tips && selectedRecipe.tips.length > 0 && (
                                    <div className="bg-yellow-50 border border-yellow-200 rounded-xl shadow-sm p-6">
                                        <h2 className="text-2xl font-bold text-claude-dark mb-4">💡 Tips</h2>
                                        <ul className="space-y-2">
                                            {selectedRecipe.tips.map((tip, index) => (
                                                <li key={index} className="flex items-start">
                                                    <span className="inline-block w-2 h-2 bg-yellow-600 rounded-full mt-2 mr-3 flex-shrink-0"></span>
                                                    <span className="text-gray-700">{tip}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Demo Notice Banner */}
                    <div className="fixed bottom-0 left-0 right-0 bg-claude-orange text-white py-3 px-4 text-center shadow-lg">
                        <p className="text-sm sm:text-base">
                            📱 <strong>Enhanced Demo:</strong> Try different views (Gallery/List/Compact), sizes (S/M/L), and sorting options! Full version includes AI recipe extraction.
                        </p>
                    </div>
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
